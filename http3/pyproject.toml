[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "httpbench"
version = "0.1.0"
description = "Compare and benchmark HTTP/2 vs HTTP/3 (QUIC): a local dual-protocol demo API plus a benchmark suite that also works against any real HTTP/3-enabled API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["http2", "http3", "quic", "benchmark", "aioquic", "httpx"]

dependencies = [
  "httpx[http2]>=0.27",
  "aioquic>=1.0",
  "hypercorn[h3]>=0.16",
  "starlette>=0.37",
  "trustme>=1.1",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
httpbench = "httpbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/httpbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
ignore = [
  "B008",    # typer.Option()/typer.Argument() as default args is the documented Typer pattern
  "PYI034",  # typing.Self needs Python 3.11+; this project supports 3.10
]
